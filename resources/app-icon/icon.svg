<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17181f"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ea7ff"/>
      <stop offset="1" stop-color="#4b4dff"/>
    </linearGradient>
  </defs>

  <!-- badge background -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- concentric fingerprint rings, echoing the lock screen motif -->
  <g fill="none" stroke="#31323e" stroke-width="3" opacity="0.7">
    <circle cx="128" cy="118" r="70"/>
    <circle cx="128" cy="118" r="86"/>
    <circle cx="128" cy="118" r="102"/>
  </g>
  <g fill="none" stroke="#3d3f4e" stroke-width="3" opacity="0.5">
    <path d="M128 48a70 70 0 0 1 61 36" stroke-linecap="round"/>
    <path d="M58 130a70 70 0 0 0 22 55" stroke-linecap="round"/>
  </g>

  <!-- key: circular bow + shaft + teeth -->
  <g>
    <circle cx="128" cy="98" r="26" fill="none" stroke="url(#accent)" stroke-width="10"/>
    <rect x="122" y="120" width="12" height="66" rx="4" fill="url(#accent)"/>
    <rect x="134" y="150" width="16" height="10" rx="3" fill="url(#accent)"/>
    <rect x="134" y="168" width="22" height="10" rx="3" fill="url(#accent)"/>
  </g>
</svg>
