    <circle cx="160" cy="150" r="74"/>
    <path d="M226 150a66 66 0 0 1 -66 66" stroke-dasharray="1 10"/>
  </g>

  <!-- centered key -->
  <g>
    <circle cx="160" cy="120" r="32" fill="none" stroke="url(#accent)" stroke-width="11"/>
    <rect x="153" y="146" width="14" height="78" rx="5" fill="url(#accent)"/>
    <rect x="167" y="182" width="18" height="11" rx="3" fill="url(#accent)"/>
